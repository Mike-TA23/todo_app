name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/todo_app
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/todo_test

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              host="localhost",
              port=5432,
              user="postgres",
              password="postgres",
              dbname="todo_app",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE todo_test")
          PY

      - name: Migrate application database
        run: python -m alembic upgrade head

      - name: Migrate test database
        env:
          MIGRATION_ENV: test
        run: python -m alembic upgrade head

      - name: Run tests
        run: pytest -v
